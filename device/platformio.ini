; Waveshare ESP32-S3-Touch-AMOLED-1.8 (V2: CO5300 display + CST820 touch + QMI8658 IMU)
[env:esp32-s3-devkitc-1]
; The official platformio/espressif32 platform is stuck on Arduino-ESP32 2.0.17,
; which lacks esp32-hal-periman.h required by this board's QSPI display driver.
; Use the community pioarduino fork instead, which tracks Arduino-ESP32 3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM: 16 MB flash, 8 MB OPI PSRAM (confirmed via esptool chip_id).
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.extra_flags = -DBOARD_HAS_PSRAM

; Board uses native USB-Serial/JTAG, not an external USB-UART bridge.
; -I lib/edge_impulse: the Edge Impulse SDK export has no library.json/
; library.properties, so PlatformIO's LDF won't auto-add it as an include
; root for its internal path-style includes (e.g. "edge-impulse-sdk/..."),
; hence the explicit -I here instead of relying on lib/ auto-discovery.
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -I lib/edge_impulse

monitor_speed = 460800
monitor_filters = esp32_exception_decoder

lib_deps =
  links2004/WebSockets @ ^2.4.1
